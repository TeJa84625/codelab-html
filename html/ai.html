<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI HTML Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
        }

        header p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media(max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: 75vh;
        }

        .status-box {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
            margin-bottom: 0.75rem;
            background-color: #1e3a8a;
            color: #bfdbfe;
        }

        .status-box.error {
            background-color: #7f1d1d;
            color: #fecaca;
        }

        .status-box.success {
            background-color: #14532d;
            color: #dcfce7;
        }

        .status-box.warning {
            background-color: #78350f;
            color: #fef08a;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .chat-bubble {
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            line-height: 1.4;
        }

        .chat-bubble.user {
            background-color: #334155;
        }

        .chat-bubble.ai {
            background-color: rgba(51, 65, 85, 0.4);
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        textarea {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .panel-header h2 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .tabs {
            display: flex;
            gap: 0.25rem;
        }

        .tab-btn {
            background-color: #0f172a;
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
        }

        .tab-btn.active {
            background-color: #334155;
            color: white;
        }

        .preview-frame {
            flex: 1;
            background-color: white;
            border-radius: 0.375rem;
            border: 1px solid #334155;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .code-view {
            flex: 1;
            background-color: #0f172a;
            border-radius: 0.375rem;
            border: 1px solid #334155;
            padding: 0.75rem;
            overflow: auto;
            display: none;
        }

        pre code {
            font-family: monospace;
            font-size: 0.75rem;
            color: #4ade80;
            white-space: pre-wrap;
        }

        .hidden {
            display: none !important;
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Local AI HTML Generator</h1>
        <p>100% Client-Side In-Browser Execution via WebGPU & WebLLM</p>
    </header>

    <main>
        <!-- Left Panel: Controls & Chat -->
        <div class="panel">
            <div id="status" class="status-box">Status: Ready to load model. Ensure WebGPU hardware acceleration is
                available.</div>
            <button id="init-btn">Initialize AI Model (Llama-3.2-1B)</button>

            <div id="chat-container" class="chat-container" style="margin-top: 0.75rem;">
                <div style="color: #64748b; font-style: italic;">Chat activity logs will display here...</div>
            </div>

            <div class="input-row">
                <textarea id="user-prompt" rows="2"
                    placeholder="Describe the page you want (e.g., 'A stylish calculator with buttons')"
                    disabled></textarea>
                <button id="send-btn" disabled>Generate</button>
            </div>
        </div>

        <!-- Right Panel: Sandbox Preview & Source Code -->
        <div class="panel">
            <div class="panel-header">
                <h2>Live View & Source</h2>
                <div class="tabs">
                    <button id="tab-preview-btn" class="tab-btn active">Preview</button>
                    <button id="tab-code-btn" class="tab-btn">Code Source</button>
                </div>
            </div>

            <div id="preview-wrapper" class="preview-frame">
                <iframe id="html-preview"></iframe>
            </div>

            <div id="code-wrapper" class="code-view">
                <pre><code id="html-code-display">// Generated HTML will appear here...</code></pre>
            </div>
        </div>
    </main>

    <!-- Connect external JavaScript file as a module -->
    <script type="module" src="./ai.js"></script>
</body>

</html>
